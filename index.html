<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MainYuk - Game Online Gratis</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#05070f;--panel:#0c1226;--cyan:#3df5ff;--mag:#ff2fd6;--lime:#39ff88;--text:#e8f4ff;--haze:#8aa0d6;--cut:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--void)}
body{background:radial-gradient(ellipse at 50% -10%,#1b2a6b 0,transparent 60%) fixed;color:var(--text);font-family:Oxanium,"Segoe UI",system-ui,sans-serif;font-weight:400;min-height:100vh}
body::before{content:"";position:fixed;left:-50%;right:-50%;bottom:0;height:55vh;z-index:-1;opacity:.55;background:linear-gradient(rgba(61,245,255,.4) 1px,transparent 1px) 0 0/100% 48px,linear-gradient(90deg,rgba(255,47,214,.35) 1px,transparent 1px) 0 0/64px 100%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);animation:drift 5s linear infinite}
@keyframes drift{to{background-position:0 48px,0 0}}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;padding:10px 24px;background:rgba(5,7,15,.84);backdrop-filter:blur(8px);border-bottom:1px solid rgba(61,245,255,.35);overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(61,245,255,.35) 50%,transparent 60%);transform:translateX(-100%);animation:sweep 1.8s ease-out .3s 1 forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(100%)}}
.logo{font-size:30px;font-weight:800;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 14px rgba(61,245,255,.8),2px 0 var(--mag);animation:glitch 7s infinite}
.logo b{color:var(--mag)}
@keyframes glitch{0%,92%,100%{transform:none;text-shadow:0 0 14px rgba(61,245,255,.8),2px 0 var(--mag)}93%{transform:translate(-2px,1px);text-shadow:-3px 0 var(--mag),3px 0 var(--cyan)}95%{transform:translate(2px,-1px);text-shadow:3px 0 var(--mag),-3px 0 var(--cyan)}97%{transform:translate(-1px,0);text-shadow:-2px 0 var(--cyan),2px 0 var(--mag)}}
.search{flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;padding:9px 16px;border:1px solid rgba(61,245,255,.4);border-radius:0;background:rgba(12,18,38,.9);color:var(--text);font:inherit;clip-path:var(--cut)}
.search input:focus{outline:none;border-color:var(--cyan);box-shadow:inset 0 0 14px rgba(61,245,255,.35)}
.user{display:flex;align-items:center;gap:10px;padding:5px 18px 5px 6px;font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,rgba(61,245,255,.22),rgba(255,47,214,.22));clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.av{width:30px;height:30px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--mag));color:var(--void);font-weight:800;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(57,255,136,.7)}100%{box-shadow:0 0 0 8px rgba(57,255,136,0)}}
.shell{display:grid;grid-template-columns:240px 1fr;gap:26px;max-width:1380px;margin:0 auto;padding:22px 24px 48px}
.side{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 108px);display:flex;flex-direction:column;padding:1px;background:linear-gradient(160deg,var(--cyan),rgba(61,245,255,.1) 45%,var(--mag));clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.side::before{content:"";position:absolute;inset:1px;background:rgba(7,10,24,.97);clip-path:polygon(17px 0,100% 0,100% calc(100% - 17px),calc(100% - 17px) 100%,0 100%,0 17px)}
.side>*{position:relative}
.side-t{padding:16px 18px 8px;font-weight:800;letter-spacing:.16em;color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
.side-t::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
nav{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:8px 14px 18px;scrollbar-width:thin;scrollbar-color:var(--cyan) transparent}
nav button{position:relative;display:flex;align-items:center;gap:11px;border:0;overflow:hidden;background:rgba(61,245,255,.06);color:var(--haze);font:inherit;font-weight:600;text-align:left;padding:11px 12px;cursor:pointer;letter-spacing:.03em;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));opacity:0;transform:translateX(-26px);animation:slidein .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*60ms + 250ms);transition:color .2s,background .2s}
@keyframes slidein{to{opacity:1;transform:none}}
nav button>*{position:relative}
nav button span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button i{width:8px;height:8px;flex:none;background:var(--haze);transform:rotate(45deg);transition:background .2s,transform .2s}
nav button em{font-style:normal;font-size:12px;padding:1px 7px;border:1px solid currentColor;opacity:.75}
nav button::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(61,245,255,.38),transparent);transform:translateX(-100%)}
nav button:hover::before{transform:translateX(100%);transition:transform .6s}
nav button:hover{color:var(--text);background:rgba(255,47,214,.14)}
nav button:hover i{background:var(--mag);transform:rotate(225deg) scale(1.3)}
nav button::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;opacity:0;background:linear-gradient(90deg,var(--cyan),var(--mag),var(--cyan));background-size:200% 100%}
nav button.on{color:var(--cyan);background:linear-gradient(90deg,rgba(61,245,255,.3),rgba(255,47,214,.12));box-shadow:inset 3px 0 var(--cyan);text-shadow:0 0 10px rgba(61,245,255,.8)}
nav button.on::after{opacity:1;animation:flow 2s linear infinite}
nav button.on i{background:var(--cyan);animation:spin 2.4s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(405deg)}}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.note{background:rgba(12,18,38,.9);border:1px solid var(--mag);padding:12px 16px;margin-bottom:16px;color:var(--haze);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-flow:dense;gap:14px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;display:block;text-align:left;background:linear-gradient(135deg,var(--cyan),var(--mag));clip-path:var(--cut);transition:transform .15s}
.fx .tile{animation:pop .4s backwards;animation-delay:calc(min(var(--i),20)*25ms)}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.tile:nth-child(11n+1){grid-column:span 2;grid-row:span 2}
.tile img{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:cover;background:var(--panel);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.tile span{position:absolute;inset:auto 2px 2px 2px;padding:26px 10px 8px;font-weight:700;font-size:14px;line-height:1.15;letter-spacing:.03em;background:linear-gradient(transparent,rgba(5,7,15,.95))}
.tile:hover{transform:translateY(-4px);background:linear-gradient(135deg,var(--mag),var(--cyan))}
.tile:hover img{filter:brightness(1.15) saturate(1.25)}
.more{display:block;margin:28px auto 0;padding:11px 34px;border:0;background:var(--cyan);color:var(--void);font:inherit;font-weight:800;letter-spacing:.08em;cursor:pointer;clip-path:var(--cut)}
.more:hover{background:var(--mag);color:var(--text)}
.msg{color:var(--haze);padding:30px 0}
dialog{border:1px solid var(--cyan);padding:0;background:var(--void);color:var(--text);width:min(1100px,96vw);height:min(780px,92vh);overflow:hidden;box-shadow:0 0 40px rgba(61,245,255,.35)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(2,3,10,.88);backdrop-filter:blur(4px)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid rgba(61,245,255,.35)}
.bar h2{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cyan)}
.bar button{border:0;padding:5px 16px;font:inherit;font-weight:700;background:var(--cyan);color:var(--void);cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.bar .x{background:var(--mag);color:var(--text)}
iframe{flex:1;width:100%;border:0;background:#000}
@media(max-width:760px){header{flex-wrap:wrap;padding:10px 14px}.user{margin-left:auto}.search{order:3;max-width:none;width:100%;margin:0}
.shell{grid-template-columns:1fr;gap:12px;padding:12px 14px 40px}
.side{position:static;max-height:none;clip-path:none;background:none;padding:0}.side::before,.side-t{display:none}
nav{flex-direction:row;overflow-x:auto;padding:4px 0}nav button{flex:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}nav button{opacity:1;transform:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="./">MAIN<b>YUK</b></a>
  <div class="search"><input id="q" type="search" placeholder="Cari game..." aria-label="Cari game"></div>
  <div class="user"><span class="av">P</span><span>prabbbz</span><i class="dot"></i></div>
</header>
<div class="shell">
  <aside class="side">
    <div class="side-t">Kategori</div>
    <nav id="cats" aria-label="Kategori"></nav>
  </aside>
  <main>
    <div id="note"></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden>Muat lebih banyak</button>
  </main>
</div>
<dialog id="player">
  <div class="bar">
    <h2 id="ptitle"></h2>
    <button id="pfs">Layar penuh</button>
    <button class="x" id="pclose">Tutup</button>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write" title="Game"></iframe>
</dialog>

<script>
/* Katalog diambil dari games.json (unduh di widgets.playgama.com setelah login, simpan di folder yang sama) */
const CONFIG = { src: "games.json", batch: 60 };
const $ = id => document.getElementById(id);
let all = [], cat = "", shown = 0;

/* ----- Pembaca data: mencari game di posisi mana pun dalam JSON ----- */
const GAMEURL = /\/export\/game\//i;
const loc = v => typeof v === "string" ? v : Array.isArray(v) ? loc(v[0]) : v && typeof v === "object" ? loc(v.en || v.EN || v.name || v.title || Object.values(v).find(x => typeof x === "string")) : "";
function findGames(d, out = []) {
  if (Array.isArray(d)) d.forEach(x => findGames(x, out));
  else if (d && typeof d === "object") {
    if (Object.values(d).some(v => typeof v === "string" && GAMEURL.test(v))) out.push(d);
    else Object.values(d).forEach(x => findGames(x, out));
  }
  return out;
}
function walk(o, path, out) {
  if (typeof o === "string") out.push([path, o]);
  else if (o && typeof o === "object") for (const k in o) walk(o[k], path + "." + k, out);
  return out;
}
function normalize(g) {
  const flat = walk(g, "", []);
  const URLRE = /https?:\/\/[^\s"'<>]*\/export\/game\/[^\s"'<>]*/i;
  const hit = flat.find(([k, v]) => /game_?url/i.test(k) && URLRE.test(v)) || flat.find(([, v]) => URLRE.test(v));
  const url = hit ? hit[1].match(URLRE)[0] : flat.find(([, v]) => GAMEURL.test(v))[1];
  const imgs = flat.filter(([k, v]) => /^https?:/.test(v) && (/\.(png|jpe?g|webp|gif|avif)(\?|$)/i.test(v) || /thumb|cover|icon|image|preview|poster/i.test(k)));
  const best = imgs.find(([k]) => /thumb|cover|preview/i.test(k)) || imgs[0];
  const c = flat.find(([k]) => /genre|categor/i.test(k));
  const title = loc(g.title || g.name) || url.split("/").pop().replace(/[-_]+/g, " ").replace(/\b\w/g, m => m.toUpperCase());
  return { title, img: best ? best[1] : "", url, cat: c ? c[1] : "" };
}
/* ------------------------------------------------------------------- */

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function drawCats() {
  const n = {};
  all.forEach(g => { if (g.cat) n[g.cat] = (n[g.cat] || 0) + 1; });
  const list = ["", ...Object.keys(n).sort((a, b) => n[b] - n[a]).slice(0, 14)];
  const nav = $("cats"); nav.textContent = "";
  list.forEach((slug, i) => {
    const b = el("button");
    b.dataset.slug = slug; b.style.setProperty("--i", i);
    b.append(el("i"), el("span", "", slug || "Semua"), el("em", "", String(slug ? n[slug] : all.length)));
    b.onclick = () => { cat = slug; markCats(); drawGames(true); };
    nav.append(b);
  });
  markCats();
}
function markCats() { [...$("cats").children].forEach(b => b.classList.toggle("on", b.dataset.slug === cat)); }

function drawGames(reset) {
  const q = $("q").value.trim().toLowerCase(), grid = $("grid");
  const list = all.filter(g => (!cat || g.cat === cat) && g.title.toLowerCase().includes(q));
  shown = reset ? CONFIG.batch : shown;
  grid.classList.toggle("fx", !!reset);
  grid.textContent = "";
  if (!list.length) grid.append(el("p", "msg", "Game tidak ditemukan."));
  list.slice(0, shown).forEach((g, idx) => {
    const t = el("button", "tile");
    t.style.setProperty("--i", idx);
    if (g.img) { const i = el("img"); i.src = g.img; i.alt = ""; i.loading = "lazy"; t.append(i); }
    t.append(el("span", "", g.title));
    t.onclick = () => play(g);
    grid.append(t);
  });
  $("more").hidden = shown >= list.length;
}

function setData(d) {
  all = findGames(d).map(normalize);
  if (!all.length) {
    const pre = el("pre", "", JSON.stringify(d, null, 1).slice(0, 700));
    pre.style.cssText = "white-space:pre-wrap;font-size:12px;margin-top:8px";
    const n = el("div", "note", "File terbaca, tapi tidak ada link game (/export/game/) di dalamnya. Kirim potongan ini ke Claude:");
    n.append(pre); $("note").replaceChildren(n);
    return;
  }
  $("note").textContent = "";
  drawCats(); drawGames(true);
}

function showPicker() {
  $("grid").textContent = ""; $("more").hidden = true;
  const n = el("div", "note");
  n.append("games.json belum ditemukan. Unduh katalog di widgets.playgama.com (login dulu supaya CLID kamu ikut), simpan sebagai games.json di folder ini, atau pilih filenya di sini: ");
  const f = el("input"); f.type = "file"; f.accept = ".json,application/json";
  f.onchange = async () => { try { setData(JSON.parse(await f.files[0].text())); } catch (e) { alert("File tidak bisa dibaca: " + e.message); } };
  n.append(f); $("note").replaceChildren(n);
}

async function load() {
  try {
    const r = await fetch(CONFIG.src);
    if (!r.ok) throw new Error("HTTP " + r.status);
    setData(await r.json());
  } catch (e) { showPicker(); }
}

function play(g) {
  $("ptitle").textContent = g.title;
  $("frame").src = g.url;
  $("player").showModal();
}
$("pclose").onclick = () => $("player").close();
$("player").onclose = () => { $("frame").src = "about:blank"; };
$("pfs").onclick = () => $("frame").requestFullscreen && $("frame").requestFullscreen();
$("more").onclick = () => { shown += CONFIG.batch; drawGames(false); };
$("q").oninput = () => drawGames(true);

load();
</script>
</body>
</html>
