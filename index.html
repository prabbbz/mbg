<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MainYuk - Game Online Gratis</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#160f3a;--grape:#2b1d6b;--banana:#ffd426;--coral:#ff5a5f;--mint:#2fe0b0;--text:#fff;--muted:#b9acd9}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--text);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;min-height:100vh}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--grape);display:flex;gap:16px;align-items:center;padding:10px 20px;border-bottom:4px solid var(--banana)}
.logo{font-size:30px;font-weight:800;color:var(--banana);letter-spacing:-.5px;transform:rotate(-2deg)}
.logo b{color:var(--coral)}
.search{flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;padding:8px 16px;border-radius:99px;border:3px solid transparent;background:var(--night);color:var(--text);font:inherit}
.search input:focus{outline:none;border-color:var(--mint)}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;scrollbar-width:thin}
nav button{flex:none;border:0;border-radius:99px;padding:6px 16px;font:inherit;font-weight:700;background:var(--grape);color:var(--text);cursor:pointer}
nav button:hover{background:#3d2a8c}
nav button.on{background:var(--banana);color:var(--night)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
main{padding:0 20px 40px;max-width:1280px;margin:0 auto}
.note{background:var(--grape);border-left:6px solid var(--coral);border-radius:10px;padding:10px 14px;margin-bottom:14px;color:var(--muted);font-size:15px}
.note code{color:var(--banana)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-flow:dense;gap:12px}
.tile{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--grape);border:0;padding:0;cursor:pointer;color:inherit;font:inherit;display:block;text-align:left}
.tile:nth-child(11n+1){grid-column:span 2;grid-row:span 2}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;inset:auto 0 0 0;padding:20px 10px 8px;font-weight:700;font-size:15px;line-height:1.1;background:linear-gradient(transparent,rgba(10,5,40,.9))}
.tile:hover{transform:scale(1.04) rotate(-1deg);transition:transform .15s}
.cat{display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:800;color:var(--night)}
.cat span{position:static;background:none;padding:8px;font-size:inherit}
.more{display:block;margin:24px auto 0;padding:10px 28px;border:0;border-radius:99px;background:var(--mint);color:var(--night);font:inherit;font-weight:800;cursor:pointer}
.msg{color:var(--muted);padding:30px 0;text-align:center}
dialog{border:0;padding:0;background:var(--night);color:var(--text);width:min(1100px,96vw);height:min(760px,92vh);border-radius:16px;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(10,5,30,.85)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--grape)}
.bar h2{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button,.bar a{border:0;border-radius:99px;padding:4px 14px;font:inherit;font-weight:700;background:var(--banana);color:var(--night);cursor:pointer}
.bar .x{background:var(--coral);color:var(--text)}
iframe{flex:1;width:100%;border:0;background:#000}
@media(max-width:560px){header{flex-wrap:wrap}.search{max-width:none;width:100%}}
@media(prefers-reduced-motion:reduce){.tile:hover{transform:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="./">Main<b>Yuk</b></a>
  <div class="search"><input id="q" type="search" placeholder="Cari game..." aria-label="Cari game"></div>
</header>
<nav id="cats" aria-label="Kategori"></nav>
<main>
  <div id="note"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Muat lebih banyak</button>
</main>
<dialog id="player">
  <div class="bar">
    <h2 id="ptitle"></h2>
    <a id="pout" target="_blank" rel="noopener">Buka di tab baru</a>
    <button id="pfs">Layar penuh</button>
    <button class="x" id="pclose">Tutup</button>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write" title="Game"></iframe>
</dialog>

<script>
/* Katalog diambil dari games.json (unduh di widgets.playgama.com setelah login, simpan di folder yang sama) */
const CONFIG = { src: "games.json", batch: 60 };
const $ = id => document.getElementById(id);
let all = [], cat = "", shown = 0;

/* ----- Pembaca data: mencari game di posisi mana pun dalam JSON ----- */
const GAMEURL = /\/export\/game\//i;
const loc = v => typeof v === "string" ? v : Array.isArray(v) ? loc(v[0]) : v && typeof v === "object" ? loc(v.en || v.EN || v.name || v.title || Object.values(v).find(x => typeof x === "string")) : "";
function findGames(d, out = []) {
  if (Array.isArray(d)) d.forEach(x => findGames(x, out));
  else if (d && typeof d === "object") {
    if (Object.values(d).some(v => typeof v === "string" && GAMEURL.test(v))) out.push(d);
    else Object.values(d).forEach(x => findGames(x, out));
  }
  return out;
}
function walk(o, path, out) {
  if (typeof o === "string") out.push([path, o]);
  else if (o && typeof o === "object") for (const k in o) walk(o[k], path + "." + k, out);
  return out;
}
function normalize(g) {
  const flat = walk(g, "", []);
  const url = flat.find(([, v]) => GAMEURL.test(v))[1];
  const imgs = flat.filter(([k, v]) => /^https?:/.test(v) && (/\.(png|jpe?g|webp|gif|avif)(\?|$)/i.test(v) || /thumb|cover|icon|image|preview|poster/i.test(k)));
  const best = imgs.find(([k]) => /thumb|cover|preview/i.test(k)) || imgs[0];
  const c = flat.find(([k]) => /genre|categor/i.test(k));
  const title = loc(g.title || g.name) || url.split("/").pop().replace(/[-_]+/g, " ").replace(/\b\w/g, m => m.toUpperCase());
  return { title, img: best ? best[1] : "", url, cat: c ? c[1] : "" };
}
/* ------------------------------------------------------------------- */

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function drawCats() {
  const n = {};
  all.forEach(g => { if (g.cat) n[g.cat] = (n[g.cat] || 0) + 1; });
  const list = ["", ...Object.keys(n).sort((a, b) => n[b] - n[a]).slice(0, 14)];
  const nav = $("cats"); nav.textContent = "";
  list.forEach(slug => {
    const b = el("button", slug === cat ? "on" : "", slug || "Semua");
    b.onclick = () => { cat = slug; drawCats(); drawGames(true); };
    nav.append(b);
  });
}

function drawGames(reset) {
  const q = $("q").value.trim().toLowerCase(), grid = $("grid");
  const list = all.filter(g => (!cat || g.cat === cat) && g.title.toLowerCase().includes(q));
  shown = reset ? CONFIG.batch : shown;
  grid.textContent = "";
  if (!list.length) grid.append(el("p", "msg", "Game tidak ditemukan."));
  list.slice(0, shown).forEach(g => {
    const t = el("button", "tile");
    if (g.img) { const i = el("img"); i.src = g.img; i.alt = ""; i.loading = "lazy"; t.append(i); }
    t.append(el("span", "", g.title));
    t.onclick = () => play(g);
    grid.append(t);
  });
  $("more").hidden = shown >= list.length;
}

function setData(d) {
  all = findGames(d).map(normalize);
  if (!all.length) {
    const pre = el("pre", "", JSON.stringify(d, null, 1).slice(0, 700));
    pre.style.cssText = "white-space:pre-wrap;font-size:12px;margin-top:8px";
    const n = el("div", "note", "File terbaca, tapi tidak ada link game (/export/game/) di dalamnya. Kirim potongan ini ke Claude:");
    n.append(pre); $("note").replaceChildren(n);
    return;
  }
  $("note").textContent = "";
  drawCats(); drawGames(true);
}

function showPicker() {
  $("grid").textContent = ""; $("more").hidden = true;
  const n = el("div", "note");
  n.append("games.json belum ditemukan. Unduh katalog di widgets.playgama.com (login dulu supaya CLID kamu ikut), simpan sebagai games.json di folder ini, atau pilih filenya di sini: ");
  const f = el("input"); f.type = "file"; f.accept = ".json,application/json";
  f.onchange = async () => { try { setData(JSON.parse(await f.files[0].text())); } catch (e) { alert("File tidak bisa dibaca: " + e.message); } };
  n.append(f); $("note").replaceChildren(n);
}

async function load() {
  try {
    const r = await fetch(CONFIG.src);
    if (!r.ok) throw new Error("HTTP " + r.status);
    setData(await r.json());
  } catch (e) { showPicker(); }
}

function play(g) {
  $("ptitle").textContent = g.title;
  $("pout").href = g.url;
  $("frame").src = g.url;
  $("player").showModal();
}
$("pclose").onclick = () => $("player").close();
$("player").onclose = () => { $("frame").src = "about:blank"; };
$("pfs").onclick = () => $("frame").requestFullscreen && $("frame").requestFullscreen();
$("more").onclick = () => { shown += CONFIG.batch; drawGames(false); };
$("q").oninput = () => drawGames(true);

load();
</script>
</body>
</html>
